<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dealer Returns AI Inspector</title>
  <style>
    :root {
      --bg-1: #f8f5ee;
      --bg-2: #e5edf3;
      --ink: #182231;
      --accent: #1f6f78;
      --accent-2: #de7c5a;
      --panel: #ffffffdd;
      --ok: #1c8c4f;
      --warn: #c76a05;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, #fff8e9 0%, transparent 35%),
        radial-gradient(circle at 80% 10%, #dce8ff 0%, transparent 30%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid #c6d0db;
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(8px);
      animation: rise 500ms ease-out;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      letter-spacing: 0.02em;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }

    p { margin: 8px 0 0; }

    .panel {
      background: var(--panel);
      border: 1px solid #c6d0db;
      border-radius: 16px;
      padding: 18px;
      animation: rise 650ms ease-out;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    input[type=file], button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #a8b8c7;
      font-size: 0.95rem;
    }

    button {
      background: linear-gradient(90deg, var(--accent), #26848f);
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px #1f6f7840;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      background: #ecf2f7;
      border: 1px solid #c5d3e0;
      font-size: 0.9rem;
    }

    pre {
      margin: 0;
      background: #11202f;
      color: #d9f0ff;
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      max-height: 440px;
    }

    .status { font-weight: 600; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Dealer Returns AI Inspection</h1>
      <p>Upload RGA and Rejected Parts documents (image or PDF). OCR + open-source LLM returns BMS-ready JSON with confidence routing.</p>
      <div class="meta">
        <div class="chip">Threshold: 80% auto-apply</div>
        <div class="chip">Mode: Open-source models via Hugging Face</div>
      </div>
    </section>

    <section class="panel grid">
      <label>
        RGA Document
        <input id="rga" type="file" accept="image/*,.pdf,application/pdf" />
      </label>
      <label>
        Rejected Parts Document
        <input id="rej" type="file" accept="image/*,.pdf,application/pdf" />
      </label>
      <div>
        <button id="run">Process Documents</button>
      </div>
    </section>

    <section class="panel">
      <div id="status" class="status">Status: waiting for upload</div>
    </section>

    <section class="panel">
      <h3>JSON Output</h3>
      <pre id="out">{}</pre>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    document.getElementById("run").addEventListener("click", async () => {
      const rga = document.getElementById("rga").files[0];
      const rej = document.getElementById("rej").files[0];

      if (!rga || !rej) {
        statusEl.innerHTML = '<span class="warn">Status: choose both images first</span>';
        return;
      }

      const form = new FormData();
      form.append("rga_image", rga);
      form.append("rejected_image", rej);

      statusEl.textContent = "Status: processing...";
      outEl.textContent = "{}";

      try {
        const res = await fetch("/process", { method: "POST", body: form });
        const data = await res.json();

        if (!res.ok) {
          statusEl.innerHTML = '<span class="warn">Status: failed</span>';
          outEl.textContent = JSON.stringify(data, null, 2);
          return;
        }

        const warningText = (data.warnings && data.warnings.length)
          ? ` | <span class="warn">Warnings: ${data.warnings.join("; ")}</span>`
          : "";
        statusEl.innerHTML = `<span class="ok">Status: done</span> | Auto-applied: ${data.auto_applied_lines}/${data.total_lines} | Review: ${data.review_lines}${warningText}`;
        outEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        statusEl.innerHTML = '<span class="warn">Status: network or server error</span>';
        outEl.textContent = String(err);
      }
    });
  </script>
</body>
</html>
