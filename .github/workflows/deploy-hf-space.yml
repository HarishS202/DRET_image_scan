name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

      - name: Push to Hugging Face Space
        env:
          HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_REPO: huggingface.co/spaces/HarishS202/dealer-returns-ai-inspector
        run: |
          if [ -z "$HF_SPACE_TOKEN" ]; then
            echo "HF_SPACE_TOKEN secret is missing."
            exit 1
          fi

          git remote remove hf-space 2>/dev/null || true
          git remote add hf-space "https://oauth2:${HF_SPACE_TOKEN}@${HF_SPACE_REPO}"
          git push hf-space HEAD:main --force
